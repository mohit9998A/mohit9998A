    <style>
      .f{font-family:'Segoe UI',Inter,'Helvetica Neue',Arial,sans-serif}
      .b{transform-box:fill-box;transform-origin:center;animation:talk 1.4s ease-in-out infinite}
      @keyframes talk{0%,100%{transform:scaleY(.35)}50%{transform:scaleY(1)}}
      @media (prefers-reduced-motion:reduce){.b{animation:none}}
    </style>
