<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="Mohit Dutta, AI Engineer" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="wave" gradientUnits="userSpaceOnUse" x1="690" y1="0" x2="1160" y2="0">
      <stop offset="0" stop-color="#F2A93B"/><stop offset="0.55" stop-color="#E0577A"/><stop offset="1" stop-color="#5CC8E0"/>
