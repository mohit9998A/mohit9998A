<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="280" viewBox="0 0 1200 280" font-family="'Segoe UI',Inter,'Helvetica Neue',Arial,sans-serif" role="img" aria-label="Engineering lifecycle from problem to impact" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0L10,5L0,10z" fill="#4A5D7E"/></marker></defs>
<rect width="1200" height="280" rx="22" fill="#0E1726"/>
<text x="48" y="52" font-size="22" font-weight="700" fill="#E8EDF5">How I take an idea to production</text>
<line x1="144" y1="130" x2="266" y2="130" stroke="#4A5D7E" stroke-width="2" marker-end="url(#a)"/>
<circle cx="110" cy="130" r="30" fill="none" stroke="#F2A93B" stroke-width="3"/>
<text x="110" y="138" font-size="22" font-weight="700" fill="#F2A93B" text-anchor="middle">1</text>
<text x="110" y="192" font-size="17" font-weight="600" fill="#E8EDF5" text-anchor="middle">Problem</text>
<text x="110" y="216" font-size="14" fill="#8A99B3" text-anchor="middle">Find the real constraint</text>
<line x1="340" y1="130" x2="462" y2="130" stroke="#4A5D7E" stroke-width="2" marker-end="url(#a)"/>
<circle cx="306" cy="130" r="30" fill="none" stroke="#EE8A4F" stroke-width="3"/>
<text x="306" y="138" font-size="22" font-weight="700" fill="#EE8A4F" text-anchor="middle">2</text>
<text x="306" y="192" font-size="17" font-weight="600" fill="#E8EDF5" text-anchor="middle">Architecture</text>
<text x="306" y="216" font-size="14" fill="#8A99B3" text-anchor="middle">Simplest design that works</text>
<line x1="536" y1="130" x2="658" y2="130" stroke="#4A5D7E" stroke-width="2" marker-end="url(#a)"/>
<circle cx="502" cy="130" r="30" fill="none" stroke="#E0577A" stroke-width="3"/>
<text x="502" y="138" font-size="22" font-weight="700" fill="#E0577A" text-anchor="middle">3</text>
<text x="502" y="192" font-size="17" font-weight="600" fill="#E8EDF5" text-anchor="middle">AI / ML system</text>
<text x="502" y="216" font-size="14" fill="#8A99B3" text-anchor="middle">Train, retrieve, evaluate</text>
<line x1="732" y1="130" x2="854" y2="130" stroke="#4A5D7E" stroke-width="2" marker-end="url(#a)"/>
<circle cx="698" cy="130" r="30" fill="none" stroke="#B77AA8" stroke-width="3"/>
<text x="698" y="138" font-size="22" font-weight="700" fill="#B77AA8" text-anchor="middle">4</text>
<text x="698" y="192" font-size="17" font-weight="600" fill="#E8EDF5" text-anchor="middle">App + automation</text>
<text x="698" y="216" font-size="14" fill="#8A99B3" text-anchor="middle">UI, APIs and n8n flows</text>
<line x1="928" y1="130" x2="1050" y2="130" stroke="#4A5D7E" stroke-width="2" marker-end="url(#a)"/>
<circle cx="894" cy="130" r="30" fill="none" stroke="#7FA6C9" stroke-width="3"/>
<text x="894" y="138" font-size="22" font-weight="700" fill="#7FA6C9" text-anchor="middle">5</text>
<text x="894" y="192" font-size="17" font-weight="600" fill="#E8EDF5" text-anchor="middle">Deployment</text>
<text x="894" y="216" font-size="14" fill="#8A99B3" text-anchor="middle">Ship where users are</text>
<circle cx="1090" cy="130" r="30" fill="none" stroke="#5CC8E0" stroke-width="3"/>
<text x="1090" y="138" font-size="22" font-weight="700" fill="#5CC8E0" text-anchor="middle">6</text>
<text x="1090" y="192" font-size="17" font-weight="600" fill="#E8EDF5" text-anchor="middle">Impact</text>
<text x="1090" y="216" font-size="14" fill="#8A99B3" text-anchor="middle">Measure, then improve</text>
<path d="M1090,98 C1090,60 110,60 110,98" fill="none" stroke="#5CC8E0" stroke-width="1.5" stroke-dasharray="5 6" marker-end="url(#a)" opacity=".7"/>
<rect x="440" y="58" width="320" height="22" fill="#0E1726"/><text x="600" y="74" font-size="13" fill="#5CC8E0" text-anchor="middle" opacity=".9">every deployment feeds the next iteration</text>
<text x="600" y="256" font-size="14" fill="#B7C3D7" text-anchor="middle" font-style="italic">Research is valuable. A working system is better. A useful system is the goal.</text>
</svg>