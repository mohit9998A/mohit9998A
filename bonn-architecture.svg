<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" font-family="'Segoe UI',Inter,'Helvetica Neue',Arial,sans-serif" role="img" aria-label="Bonn AI Receptionist architecture">
<defs>
 <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0L10,5L0,10z" fill="#7F90AD"/></marker>
 <marker id="r" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0L10,5L0,10z" fill="#5CC8E0"/></marker>
</defs>
<rect width="1200" height="500" rx="22" fill="#0E1726"/>
<text x="48" y="52" font-size="22" font-weight="700" fill="#E8EDF5">Bonn AI Receptionist: how a call flows</text>
<text x="48" y="78" font-size="14" fill="#8A99B3">High-level view of the real-time voice pipeline</text>

<!-- caller -->
<rect x="48" y="170" width="140" height="92" rx="14" fill="#16233A" stroke="#F2A93B" stroke-width="2"/>
<text x="118" y="208" font-size="26" text-anchor="middle">📞</text>
<text x="118" y="240" font-size="16" font-weight="600" fill="#E8EDF5" text-anchor="middle">Caller</text>

<!-- telephony -->
<rect x="236" y="170" width="160" height="92" rx="14" fill="#16233A" stroke="#2C3F60"/>
<text x="316" y="208" font-size="16" font-weight="600" fill="#E8EDF5" text-anchor="middle">Exotel SIP</text>
<text x="316" y="232" font-size="13" fill="#8A99B3" text-anchor="middle">business phone line</text>

<!-- livekit -->
<rect x="444" y="170" width="160" height="92" rx="14" fill="#16233A" stroke="#2C3F60"/>
<text x="524" y="208" font-size="16" font-weight="600" fill="#E8EDF5" text-anchor="middle">LiveKit</text>
<text x="524" y="232" font-size="13" fill="#8A99B3" text-anchor="middle">real-time audio room</text>

<!-- agent -->
<rect x="652" y="110" width="500" height="212" rx="18" fill="none" stroke="#E0577A" stroke-width="2" stroke-dasharray="6 6"/>
<text x="672" y="138" font-size="14" font-weight="600" fill="#E0577A">Voice agent</text>
<rect x="672" y="160" width="140" height="80" rx="12" fill="#16233A"/>
<text x="742" y="194" font-size="15" font-weight="600" fill="#E8EDF5" text-anchor="middle">Speech to text</text>
<text x="742" y="216" font-size="13" fill="#8A99B3" text-anchor="middle">Sarvam AI</text>
<rect x="832" y="160" width="140" height="80" rx="12" fill="#16233A"/>
<text x="902" y="194" font-size="15" font-weight="600" fill="#E8EDF5" text-anchor="middle">LLM reasoning</text>
<text x="902" y="216" font-size="13" fill="#8A99B3" text-anchor="middle">grounded answers</text>
<rect x="992" y="160" width="140" height="80" rx="12" fill="#16233A"/>
<text x="1062" y="194" font-size="15" font-weight="600" fill="#E8EDF5" text-anchor="middle">Text to speech</text>
<text x="1062" y="216" font-size="13" fill="#8A99B3" text-anchor="middle">ElevenLabs</text>
<line x1="812" y1="200" x2="828" y2="200" stroke="#7F90AD" stroke-width="2" marker-end="url(#a)"/>
<line x1="972" y1="200" x2="988" y2="200" stroke="#7F90AD" stroke-width="2" marker-end="url(#a)"/>
<text x="742" y="270" font-size="13" fill="#F2A93B" text-anchor="middle">Punjabi, Hindi,</text><text x="742" y="288" font-size="13" fill="#F2A93B" text-anchor="middle">Hinglish, English</text>

<!-- flows in -->
<line x1="188" y1="216" x2="232" y2="216" stroke="#7F90AD" stroke-width="2" marker-end="url(#a)"/>
<line x1="396" y1="216" x2="440" y2="216" stroke="#7F90AD" stroke-width="2" marker-end="url(#a)"/>
<line x1="604" y1="216" x2="648" y2="216" stroke="#7F90AD" stroke-width="2" marker-end="url(#a)"/>

<!-- reply path -->
<path d="M1062,240 L1062,345 L118,345 L118,266" fill="none" stroke="#5CC8E0" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#r)"/>
<text x="560" y="338" font-size="13" fill="#5CC8E0" text-anchor="middle">spoken reply streams back to the caller</text>

<!-- RAG -->
<rect x="652" y="384" width="240" height="84" rx="14" fill="#16233A" stroke="#F2A93B" stroke-width="1.5"/>
<text x="772" y="418" font-size="15" font-weight="600" fill="#E8EDF5" text-anchor="middle">Company knowledge (RAG)</text>
<text x="772" y="442" font-size="13" fill="#8A99B3" text-anchor="middle">embeddings, vector search, HF</text>
<line x1="862" y1="380" x2="862" y2="244" stroke="#F2A93B" stroke-width="2" marker-end="url(#a)"/>

<!-- n8n -->
<rect x="912" y="384" width="240" height="84" rx="14" fill="#16233A" stroke="#B77AA8" stroke-width="1.5"/>
<text x="1032" y="418" font-size="15" font-weight="600" fill="#E8EDF5" text-anchor="middle">n8n workflows</text>
<text x="1032" y="442" font-size="13" fill="#8A99B3" text-anchor="middle">APIs, webhooks, follow-up actions</text>
<line x1="942" y1="380" x2="942" y2="244" stroke="#B77AA8" stroke-width="2" marker-end="url(#a)"/>
</svg>
