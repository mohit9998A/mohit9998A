<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" font-family="'Segoe UI',Inter,'Helvetica Neue',Arial,sans-serif" role="img" aria-label="ANPR pipeline">
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0L10,5L0,10z" fill="#7F90AD"/></marker></defs>
<rect width="1200" height="300" rx="22" fill="#0E1726"/>
<text x="48" y="52" font-size="22" font-weight="700" fill="#E8EDF5">ANPR: from camera frame to plate text</text>

<!-- frame -->
<rect x="48" y="96" width="190" height="124" rx="10" fill="#16233A" stroke="#2C3F60"/>
<rect x="84" y="128" width="118" height="62" rx="12" fill="none" stroke="#8A99B3" stroke-width="2"/>
<circle cx="106" cy="194" r="9" fill="#2C3F60"/><circle cx="180" cy="194" r="9" fill="#2C3F60"/>
<rect x="76" y="118" width="134" height="84" fill="none" stroke="#F2A93B" stroke-width="2" stroke-dasharray="5 4"/>
<rect x="120" y="168" width="46" height="14" fill="none" stroke="#E0577A" stroke-width="2"/>
<text x="143" y="244" font-size="15" font-weight="600" fill="#E8EDF5" text-anchor="middle">Video frame</text>

<g font-size="15" text-anchor="middle">
<rect x="286" y="108" width="190" height="100" rx="12" fill="#16233A"/>
<text x="381" y="148" font-weight="600" fill="#E8EDF5">Detect</text>
<text x="381" y="172" font-size="13" fill="#8A99B3">vehicle + plate with YOLO</text>
<rect x="524" y="108" width="190" height="100" rx="12" fill="#16233A"/>
<text x="619" y="148" font-weight="600" fill="#E8EDF5">Clean up</text>
<text x="619" y="172" font-size="13" fill="#8A99B3">crop, deskew, threshold</text>
<text x="619" y="190" font-size="13" fill="#8A99B3">with OpenCV</text>
<rect x="762" y="108" width="190" height="100" rx="12" fill="#16233A"/>
<text x="857" y="148" font-weight="600" fill="#E8EDF5">Read</text>
<text x="857" y="172" font-size="13" fill="#8A99B3">characters with EasyOCR</text>
</g>
<line x1="238" y1="158" x2="282" y2="158" stroke="#7F90AD" stroke-width="2" marker-end="url(#a)"/>
<line x1="476" y1="158" x2="520" y2="158" stroke="#7F90AD" stroke-width="2" marker-end="url(#a)"/>
<line x1="714" y1="158" x2="758" y2="158" stroke="#7F90AD" stroke-width="2" marker-end="url(#a)"/>
<line x1="952" y1="158" x2="986" y2="158" stroke="#7F90AD" stroke-width="2" marker-end="url(#a)"/>

<!-- plate -->
<rect x="990" y="128" width="180" height="60" rx="8" fill="#F4F4F0" stroke="#1B1B1B" stroke-width="3"/>
<rect x="990" y="128" width="20" height="60" rx="6" fill="#1F4FA3"/>
<text x="1000" y="162" font-size="9" fill="#fff" text-anchor="middle" font-weight="700">IND</text>
<text x="1090" y="166" font-size="18" font-weight="800" fill="#111" text-anchor="middle">PB10 AB 1234</text>
<text x="1080" y="244" font-size="15" font-weight="600" fill="#E8EDF5" text-anchor="middle">Plate text</text>
<text x="600" y="276" font-size="13" fill="#8A99B3" text-anchor="middle">The same perception stack underpins the Smart Toll Tax System research (AI + IoT).</text>
</svg>
